server:
  port: 8082

spring:
  application:
    name: ms-documento

  spring:
    data:
      mongodb:
        uri: mongodb://localhost:27017/ms_documento?connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=30000


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8095/eureka
  instance:
    hostname: localhost